<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Quiz</title>
</head>
<body>
    <title>Quiz</title>
    <h1>question 1</h1>
    <form method ="POST">

        <h1>Question {{question_number}}</h1>
        {% if question_number == 1 %}
            <input type="radio" name="answer" value="{{option}}"> {{options}}<br>
        {% endfor %}
        <button type="submit">Submit Answer</button>
    </form>

</body>
</html>
